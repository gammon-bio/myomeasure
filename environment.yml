# Source spec for the cross-platform conda-lock (osx-arm64 + linux-64).
# This is the environment the container ships so others can run the two
# user-facing entry points: run_inference.py (Cellpose) and
# convert_vsi_to_tiff.py (Olympus .vsi -> calibrated TIFF).
#
# Regenerate the lock after any edit here:
#   conda-lock lock --mamba -f environment.yml -p osx-arm64 -p linux-64
#
# NOTE: cellpose + pytorch are taken from conda-forge (not pip) so a CPU-only
# torch is selected on linux-64 (pytorch=*=cpu_* blocks the multi-GB cuda*
# builds) and torch never enters the pip dependency graph. As a consequence the
# exact PyPI pins in requirements.txt are NOT honored here; conda-forge resolves
# a compatible set. requirements.txt remains the separate, documented overlay
# for byte-identical reproduction of the paper's analysis.
name: myomeasure
channels:
  - conda-forge
  - nodefaults
dependencies:
  # --- interpreter ---
  - python=3.11.15
  - pip

  # --- segmentation backend (CPU torch on linux, CPU/MPS on osx-arm64) ---
  - cellpose=4.0.9
  - pytorch=*=cpu_*          # force CPU build; blocks linux cuda* builds
  - torchvision

  # --- scientific stack used by the entry points (also cellpose deps) ---
  - numpy
  - scipy
  - scikit-image
  - tifffile
  - matplotlib-base
  - pandas
  - pyyaml

  # --- Bio-Formats / Java toolchain for VSI conversion ---
  # bioio-bioformats appends the endpoint ome:formats-gpl:6.7.0 and uses
  # scyjava + jgo to fetch it. jgo's resolver only searches Maven Central and
  # scijava.public, so the transitive woolz:JWlz artifact (hosted in the OME
  # artifactory) is supplied by adding that repo via scyjava.config in the
  # Dockerfile pre-bake step. The java-bridge versions are pinned for
  # reproducibility; cjdk provisions the JRE that runs Bio-Formats.
  - openjdk=11               # JDK (provides `jar`) for the jgo build step
  - maven                    # mvn kept available as a jgo fallback
  - scyjava=1.12.4
  - jgo=2.1.1
  - jpype1=1.6.0
  - ome-types

  # --- build gate ---
  - pytest

  # --- pip-only leaf (the only critical package not on conda-forge) ---
  - pip:
      - bioio-bioformats==1.3.2
